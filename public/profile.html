<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Profile</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container" style="max-width: 500px;">
    <div class="header">
        <h1>My Profile</h1>
        <button class="btn-profile" onclick="goBack()">Back</button>
    </div>
    <div class="card">
        <form id="profileForm">
            <label>Name</label>
            <input type="text" id="name" required>
            <label>Email</label>
            <input type="email" id="email" required>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">
            <p class="muted">Leave password fields blank to keep current password.</p>
            <label>Current Password</label>
            <input type="password" id="currentPassword">
            <label>New Password</label>
            <input type="password" id="newPassword">
            <button type="submit" style="margin-top: 15px;">Save Changes</button>
        </form>
        <p id="msg" class="msg"></p>
    </div>
</div>
<script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));
    if (!token || !user) window.location.href = '/login.html';

    document.getElementById('name').value = user.name;
    document.getElementById('email').value = user.email;

    function goBack() { window.location.href = `/${user.role}.html`; }

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await fetch('/api/profile', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                currentPassword: document.getElementById('currentPassword').value,
                newPassword: document.getElementById('newPassword').value
            })
        });
        const data = await res.json();
        const msg = document.getElementById('msg');
        if (res.ok) {
            msg.textContent = 'Profile updated successfully!';
            msg.className = 'msg success';
            user.name = data.name; user.email = data.email;
            localStorage.setItem('user', JSON.stringify(user));
            document.getElementById('currentPassword').value = '';
            document.getElementById('newPassword').value = '';
        } else {
            msg.textContent = data.error;
            msg.className = 'msg error';
        }
    });
</script>
</body>
</html>
