<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login / Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="centered">
    <div class="card" style="width: 350px;">
        <div id="loginForm">
            <h2>Sign In</h2>
            <input type="email" id="loginEmail" placeholder="Email" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button onclick="login()">Login</button>
            <span class="toggle-link" onclick="toggleForms()">Need an account? Register</span>
        </div>
        <div id="registerForm" class="hidden">
            <h2>Create Account</h2>
            <input type="text" id="regName" placeholder="Full Name" required>
            <input type="email" id="regEmail" placeholder="Email" required>
            <input type="password" id="regPassword" placeholder="Password" required>
            <input type="password" id="regConfirm" placeholder="Confirm Password" required>
            <button onclick="register()">Register</button>
            <span class="toggle-link" onclick="toggleForms()">Already have an account? Login</span>
        </div>
        <p id="msg" class="msg"></p>
    </div>

    <script>
        function toggleForms() {
            document.getElementById('loginForm').classList.toggle('hidden');
            document.getElementById('registerForm').classList.toggle('hidden');
            document.getElementById('msg').textContent = '';
        }

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const res = await fetch('/api/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = data.redirectTo;
            } else {
                document.getElementById('msg').textContent = data.error;
                document.getElementById('msg').className = 'msg error';
            }
        }

        async function register() {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;
            const msg = document.getElementById('msg');

            if (password !== confirm) {
                msg.textContent = 'Passwords do not match!';
                msg.className = 'msg error';
                return;
            }

            // ==========================================
            // EXTRA CREDIT (Option B): Password Strength
            // ==========================================
            const hasNumber = /[0-9]/.test(password);
            const hasUpperCase = /[A-Z]/.test(password);

            if (!hasNumber || !hasUpperCase) {
                msg.textContent = 'Password must contain at least 1 number and 1 uppercase letter!';
                msg.className = 'msg error';
                return;
            }
            // ==========================================

            const res = await fetch('/api/register', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });
            if (res.ok) {
                msg.textContent = 'Registration successful! Please login.';
                msg.className = 'msg success';
                setTimeout(toggleForms, 1500);
            } else {
                const data = await res.json();
                msg.textContent = data.error;
                msg.className = 'msg error';
            }
        }
    </script>
</body>
</html>
